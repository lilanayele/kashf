[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kashf"
version = "0.1.0"
description = "Explainable detection of trade-based money laundering for UAE traders"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Lilan Getachew"}]
dependencies = ["pandas>=2.0", "numpy>=1.26", "networkx>=3.2", "scikit-learn>=1.4", "matplotlib>=3.8",
                "fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9", "requests>=2.31"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
kashf = "kashf.cli:main"

[tool.setuptools]
packages = ["kashf"]

[tool.setuptools.package-data]
kashf = ["static/*", "models/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
