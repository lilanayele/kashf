# Kashf default configuration. Every threshold the code uses lives here.
# Invoice-layer values marked (tuned) are re-chosen on the tuning seed by `kashf evaluate`.
# Macro-layer values were fixed before the real-data run; the switch to the relative baseline was made
# after seeing real data (absolute thresholds flagged most pairs) and is disclosed in the results.

invoice:
  # price benchmark
  price_z: 2.0                # |robust z| at which an invoice line is flagged (calibration weighs it)
  # route: "fatf" = union of the FATF call-for-action and increased-monitoring lists (configs/fatf_lists.yaml)
  high_risk: fatf
  max_legs: 4
  u_turn_days: 90             # export from AE re-imported from the same foreign party within this many days
  # documents
  qty_tolerance: 0.03         # invoice vs transport-document quantity
  weight_tolerance: 0.15      # invoice vs transport-document gross weight
  doc_late_days: 120
  doc_early_days: 30
  unit_weight_ratio: 4.0      # declared kg/unit vs typical kg/unit for the HS code
  # counterparty graph
  hub_identifier_size: 6      # identifier shared by this many entities = business centre, ignored
  cycle_max_len: 5
  cycle_hop_days: 60
  cycle_qty_tolerance: 0.10
  cycle_max_expansions: 200000  # hard cap on search steps per HS code (guards against blow-up on big uploads)
  entity_resolution: fuzzy    # exact | fuzzy (normalised phones/addresses + rapidfuzz names; kashf/entities.py)
  name_similarity: 90         # 0-100, near-identical company names (only links with a similar address)
  address_similarity: 85      # 0-100
  # scoring
  alert_threshold: 0.33       # (tuned) kashf_full on seed 0 with kashf/models/calibration.json (= results/calibration.json)
  weights: {price: 1.0, route: 1.0, documents: 1.0, graph: 1.0}

api:
  max_upload_mb: 10           # per request, all files together; CSV files only

comtrade:
  reporter: 784               # United Arab Emirates
  years: [2020, 2021, 2022, 2023, 2024]
  expand_top_reexports: 30    # also pull the top-N UAE re-export HS6 codes (1 extra call); 0 = off
  min_reporters_for_reference: 5
  daily_call_budget: 450      # free tier allows 500/day; keep a margin
  seconds_between_calls: 1.2
  max_retries: 5

macro:
  cif_fob_factor: 0.10        # documented assumption: imports (CIF) ~10% above exports (FOB)
  min_flow_usd: 100000        # ignore pairs where either side is below this value
  baseline: relative          # relative = robust z within HS6 x direction (primary); absolute = raw thresholds
  gap_z_threshold: 3.0        # relative: |gap z| vs peers of the same HS6 and direction
  gap_threshold: 0.405        # absolute: |log mirror gap| > ln(1.5); set before seeing real data
  weight_gap_threshold: 0.405 # |log weight gap| > ln(1.5)
  uv_z_threshold: 3.0         # |robust z| of a flow's unit value vs the global HS6 distribution
  iforest_trees: 300
  iforest_contamination: 0.05
  injection_sizes: [0.10, 0.25, 0.50, 1.00, 2.00, 4.00, 9.00]   # +10% ... 10x (up or down)
  injection_share: 0.05       # share of eligible pairs distorted in each injection run
  injection_repeats: 5
